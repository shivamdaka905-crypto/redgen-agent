<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>RedGen Agent</title>
<style>
:root{--bg:#f7f8fa;--surface:#fff;--line:#e6e8ec;--text:#111318;--muted:#6b7280;
--accent:#0f9f7a;--accent-soft:#e7f7f1;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--surface:#14171c;--line:#23272e;--text:#e9edf2;--muted:#98a1ae;
--accent:#2fd6a5;--accent-soft:#122821;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100dvh}
.side{width:232px;flex:0 0 232px;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:650;letter-spacing:-.2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:520}
.nav a:hover,.nav button:hover{background:var(--bg);color:var(--text)}
.nav .on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.pill{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px}
.btn{all:unset;cursor:pointer;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;text-align:center}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.wrap{flex:1;display:flex;flex-direction:column;max-width:820px;width:100%;margin:0 auto;padding:18px 16px 96px}
.view{display:none}.view.on{display:block}
#chat-log{display:flex;flex-direction:column;gap:14px}
.bubble{max-width:88%;padding:12px 15px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
.who.me{align-self:flex-end;background:var(--accent);border-color:transparent;color:#fff}
.who.ai{align-self:flex-start}
.act{display:flex;flex-direction:column;gap:6px;margin:2px 0 2px 2px}
.step{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.step .ic{color:var(--muted);font-weight:700;flex:0 0 auto}
.step.run .ic{color:var(--accent)}
.step.bad{color:#b42318;border-color:#f3c6c2}
.typing{font-size:13px;color:var(--muted);padding:6px 2px}
.composer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(74px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent)}
@media(min-width:861px){.composer{left:232px;padding-bottom:16px}}
.composer .box{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
textarea#msg{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;resize:none;min-height:26px;max-height:140px;padding:6px 0}
.send{all:unset;cursor:pointer;background:var(--accent);color:#fff;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.sec-title{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.name{font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;outline:0}
.field input:focus,.field select:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center}
.del{all:unset;cursor:pointer;color:var(--muted);font-size:16px;padding:0 4px}
.shotcard{padding:0;overflow:hidden;cursor:zoom-in}
.shot{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(8,10,12,.86);display:none;place-items:center;padding:18px;z-index:40}
.modal.on{display:grid}
.modal img{max-width:100%;max-height:88vh;border-radius:12px}
.empty{color:var(--muted);font-size:13.5px;padding:14px 0}
@media(max-width:860px){
.side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;flex-direction:row;justify-content:space-around;
padding:6px 4px env(safe-area-inset-bottom);border-right:0;border-top:1px solid var(--line);z-index:20}
.side .brand,.side .foot{display:none}
.nav{flex-direction:row;width:100%;justify-content:space-around;gap:0}
.nav a,.nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 8px;border-radius:9px}
.wrap{padding-bottom:120px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">RG</div>
      <div><h1>REDGEN</h1><small>AGENT</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span class="dot"></span> <span id="footState">connected</span><br>Red Gen Development</div>
  </aside>

  <section class="main">
    <header class="top">
      <h2 id="title">Chat</h2>
      <span class="pill" id="modelPill"><span class="dot"></span> <b>…</b></span>
      <div class="grow"></div>
      <button class="btn ghost" id="newChat">New chat</button>
    </header>

    <div class="view" id="view"></div>

    <div class="composer" id="composer">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Type a task. Enter to send, Shift+Enter for a new line."></textarea>
        <button class="send" id="send" title="Send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="hint"><span>Agent can browse, screenshot, write code, generate media and schedule jobs.</span></div>
    </div>
  </section>
</div>

<div class="modal" id="modal"><img id="modalImg" alt=""></div>

<script>
const ICONS = {
  chat:'<path d="M21 12a8 8 0 1 1-3.2-6.4L21 4l-1 4.2A8 8 0 0 1 21 12Z"/>',
  screens:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 14l5-4 4 3 3-3 6 5"/>',
  memory:'<path d="M12 3v18M5 7h14M5 17h14"/>',
  notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>',
  jobs:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'
};
const TABS = [['chat','Chat'],['screens','Screens'],['memory','Memory'],['notes','Notes'],['jobs','Automations'],['settings','Settings']];
const state = { conv: localStorage.getItem('rg_conv') || ('c-' + Math.random().toString(36).slice(2,8)), tab:'chat', since:0, busy:false, poll:null };

const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');

async function api(path, opts={}) {
  const r = await fetch(path, {headers:{'Content-Type':'application/json'}, ...opts});
  if (!r.ok) throw new Error((await r.text()).slice(0,300));
  return r.json();
}

/* ---------------- nav ---------------- */
const nav = $('#nav');
TABS.forEach(([id,label]) => {
  const b = document.createElement('button');
  b.dataset.tab = id;
  b.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[id]}</svg><span>${label}</span>`;
  b.onclick = () => show(id);
  nav.appendChild(b);
});

function show(tab) {
  state.tab = tab;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#title').textContent = TABS.find(t => t[0] === tab)[1];
  $('#composer').style.display = tab === 'chat' ? '' : 'none';
  $('#newChat').style.display = tab === 'chat' ? '' : 'none';
  if (tab === 'chat') renderChat();
  if (tab === 'screens') loadScreens();
  if (tab === 'memory') loadMemory();
  if (tab === 'notes') loadNotes();
  if (tab === 'jobs') loadJobs();
  if (tab === 'settings') loadSettings();
}

/* ---------------- chat ---------------- */
const log = [];   // {role, text} for this session view
function renderChat(activityHtml='') {
  const v = $('#view');
  if (!log.length && !activityHtml) {
    v.innerHTML = `<div class="wrap"><div class="empty">
      <h3>What should I handle?</h3>
      <p>I can open websites and show you screenshots, write and run code,<br>generate images and videos, and run scheduled jobs.</p>
      <div class="chips">
        <button data-q="Open fiverr.com and screenshot my profile page">Open Fiverr and screenshot it</button>
        <button data-q="Find 5 dental clinics in Kathmandu without a website">Find clinics without a site</button>
        <button data-q="Write and run a python script that totals my expenses">Write and run code</button>
        <button data-q="Make a 15 second promo video for my website service">Make a promo video</button>
      </div></div></div>`;
    v.querySelectorAll('.chips button').forEach(b => b.onclick = () => { $('#input').value = b.dataset.q; send(); });
    return;
  }
  const parts = log.map(m => `<div class="msg ${m.role}">
      <div class="who">${m.role === 'user' ? 'You' : 'RG'}</div>
      <div class="bubble">${fmt(m.text)}</div></div>`).join('');
  v.innerHTML = `<div class="wrap">${parts}${activityHtml}</div>`;
  v.scrollTop = v.scrollHeight;
}

function activityBlock(steps) {
  if (!steps.length) return '';
  const rows = steps.map(s => {
    const failed = String(s.detail).toLowerCase().includes('failed');
    const icons = {tool:'>', query:'search', worker:'agent', think:'...', answer:'done', result:'ok'};
    const cls = failed ? 'bad' : (s.kind === 'tool' ? 'run' : 'ok');
    const label = failed ? 'failed' : (s.kind === 'tool' ? 'running' : (s.kind === 'query' ? 'searching' : 'done'));
    return `<div class="step ${cls}"><span class="ic">${icons[s.kind] || '-'}</span>
      <span class="name">${esc(s.name)}</span><span>${label}</span></div>`;
  }).join('');
  const shots = steps.filter(s => s.kind === 'result' && /screens\//.test(String(s.detail)))
    .map(s => {
      const m = String(s.detail).match(/screens\/[A-Za-z0-9._-]+\.png/);
      return m ? `<div class="shot"><img src="/api/screens/${m[0].split('/').pop()}" alt="page screenshot"></div>` : '';
    }).join('');
  return `<div class="act">${rows}${shots}</div>`;
}

async function send() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text || state.busy) return;
  input.value = ''; input.style.height = 'auto';
  log.push({role:'user', text});
  state.busy = true; $('#send').disabled = true;
  let steps = [];
  renderChat(`<div class="act"><div class="step run"><span class="ic">›</span><span class="name">thinking</span><span class="typing"><i></i><i></i><i></i></span></div></div>`);

  state.since = Date.now() / 1000 - 1;
  const tick = async () => {
    try {
      const d = await api(`/api/events?conversation_id=${state.conv}&since=${state.since}`);
      if (d.events.length) {
        d.events.forEach(e => { steps.push(e); state.since = Math.max(state.since, e.ts); });
        renderChat(activityBlock(steps));
      }
    } catch (e) {}
  };
  state.poll = setInterval(tick, 1000);

  try {
    const d = await api('/api/chat', {method:'POST', body: JSON.stringify({message: text, conversation_id: state.conv})});
    await tick();
    log.push({role:'bot', text: d.reply});
    renderChat(activityBlock(steps));
  } catch (e) {
    log.push({role:'bot', text: 'Error: ' + e.message});
    renderChat(activityBlock(steps));
  } finally {
    clearInterval(state.poll); state.poll = null; state.busy = false; $('#send').disabled = false;
  }
}

$('#send').onclick = send;
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
});
$('#newChat').onclick = () => {
  state.conv = 'c-' + Math.random().toString(36).slice(2,8);
  localStorage.setItem('rg_conv', state.conv);
  log.length = 0; state.since = 0; renderChat();
};

/* ---------------- screens ---------------- */
async function loadScreens() {
  const v = $('#view');
  v.innerHTML = '<div class="wrap"><p class="sec-title">Browser captures</p><div class="grid" id="shots"></div></div>';
  try {
    const d = await api('/api/screens');
    const names = (d.screens || []).map(s => typeof s === 'string' ? s : s.name).filter(Boolean).reverse();
    if (!names.length) { $('#shots').innerHTML = '<div class="card"><h4>No screenshots yet</h4><p>Ask the agent to open a website and the capture lands here.</p></div>'; return; }
    $('#shots').innerHTML = names.map(n => `<div class="card shotcard" data-img="/api/screens/${n}">
      <img src="/api/screens/${n}" loading="lazy" alt=""><span>${esc(n)}</span></div>`).join('');
    document.querySelectorAll('.shotcard').forEach(c => c.onclick = () => openModal(c.dataset.img));
  } catch (e) { $('#shots').innerHTML = `<div class="card"><p>${esc(e.message)}</p></div>`; }
}

/* ---------------- memory ---------------- */
async function loadMemory() {
  const v = $('#view');
  v.innerHTML = `<div class="wrap">
    <div class="card"><h4>Teach the agent a fact</h4>
      <div class="field" style="margin-top:10px"><label>Fact</label><input id="mIn" placeholder="Owner sells websites as RED GEN DEVELOPMENT"></div>
      <div class="row"><input id="mCat" placeholder="Category" style="max-width:180px"><button class="btn" id="mAdd">Save</button></div>
    </div>
    <p class="sec-title" style="margin-top:6px">Saved memory</p><div class="list" id="mList"></div></div>`;
  $('#mAdd').onclick = async () => {
    const content = $('#mIn').value.trim(); if (!content) return;
    await api('/api/memory', {method:'POST', body: JSON.stringify({content, category: $('#mCat').value || 'General'})});
    loadMemory();
  };
  const d = await api('/api/memory');
  $('#mList').innerHTML = (d.memories || []).map(m => `<div class="item"><div><small>${esc(m.category || '')}</small><div>${esc(m.content)}</div></div>
    <button class="del" data-id="${m.id}">✕</button></div>`).join('') || '<div class="item">Nothing saved yet.</div>';
  document.querySelectorAll('#mList .del').forEach(b => b.onclick = async () => {
    await api('/api/memory/' + b.dataset.id, {method:'DELETE'}); loadMemory();
  });
}

/* ---------------- notes ---------------- */
async function loadNotes() {
  const v = $('#view');
  v.innerHTML = `<div class="wrap"><div class="card"><h4>New note</h4>
      <div class="field" style="margin-top:10px"><label>Title</label><input id="nT" placeholder="Dental clinic leads"></div>
      <div class="field"><label>Body</label><input id="nB" placeholder="Write anything the agent should remember"></div>
      <button class="btn" id="nSave">Save note</button></div>
    <p class="sec-title" style="margin-top:6px">Notes</p><div class="list" id="nList"></div></div>`;
  $('#nSave').onclick = async () => {
    const title = $('#nT').value.trim(); if (!title) return;
    await api('/api/notes', {method:'POST', body: JSON.stringify({title, body: $('#nB').value})});
    loadNotes();
  };
  const d = await api('/api/notes');
  $('#nList').innerHTML = (d.notes || []).map(n => `<div class="item"><div><small>note</small><div>${esc(n)}</div></div></div>`).join('') || '<div class="item">No notes yet.</div>';
}

/* ---------------- automations ---------------- */
async function loadJobs() {
  const v = $('#view');
  v.innerHTML = `<div class="wrap"><div class="card"><h4>Schedule a job</h4>
      <div class="field" style="margin-top:10px"><label>Name</label><input id="jN" placeholder="Morning lead check"></div>
      <div class="field"><label>Prompt</label><input id="jP" placeholder="Check my inbox and summarise new leads"></div>
      <div class="field"><label>Every (minutes)</label><input id="jE" type="number" value="60" min="5"></div>
      <button class="btn" id="jAdd">Schedule</button></div>
    <p class="sec-title" style="margin-top:6px">Running automations</p><div class="list" id="jList"></div></div>`;
  $('#jAdd').onclick = async () => {
    const name = $('#jN').value.trim() || 'job', prompt = $('#jP').value.trim();
    if (!prompt) return;
    await api('/api/automations', {method:'POST', body: JSON.stringify({name, prompt, every_minutes: Number($('#jE').value) || 60})});
    loadJobs();
  };
  const d = await api('/api/automations');
  $('#jList').innerHTML = (d.automations || []).map(a => `<div class="item"><div><small>every ${a.every_minutes} min</small>
      <div>${esc(a.name)} · <span style="color:var(--dim)">${esc(a.prompt)}</span></div></div>
      <button class="del" data-id="${a.id}">✕</button></div>`).join('') || '<div class="item">Nothing scheduled.</div>';
  document.querySelectorAll('#jList .del').forEach(b => b.onclick = async () => {
    await api('/api/automations/' + b.dataset.id, {method:'DELETE'}); loadJobs();
  });
}

/* ---------------- settings ---------------- */
const PROV_LABEL = {openrouter:'OpenRouter', groq:'Groq', gemini:'Gemini', custom:'Custom'};
let settings = null;

async function loadSettings() {
  const v = $('#view');
  settings = await api('/api/settings');
  const active = settings.active_provider;
  const provs = settings.providers || {};
  v.innerHTML = `<div class="wrap"><div class="card">
    <h4>Model provider</h4><p>Pick one, paste its key. Any model id works, including your own fine-tune.</p><p style="margin-top:8px;color:#ffcf70">Heads-up: the model must support function calling, otherwise browsing and the other tools stay switched off. Free picks that do: <code>google/gemini-2.0-flash-exp:free</code>, <code>mistralai/mistral-small-3.2-24b-instruct:free</code>.</p>
    <div class="seg" style="margin-top:14px">${Object.keys(PROV_LABEL).map(k => `<button data-p="${k}" class="${k===active?'on':''}">${PROV_LABEL[k]}</button>`).join('')}</div>
    <div class="field"><label>API base URL</label><input id="sBase" value="${esc(settings.base_url||'')}"></div>
    <div class="field"><label>Model</label><input id="sModel" value="${esc(settings.model||'')}" placeholder="e.g. anthropic/claude-sonnet-4.5"></div>
    <div class="field"><label>API key ${settings.api_key ? '<span style="color:var(--mint)">· saved</span>' : ''}</label>
      <input id="sKey" type="password" placeholder="${settings.api_key ? 'leave blank to keep saved key' : 'sk-...'}"></div>
    <div class="row"><button class="btn" id="sSave">Save provider</button><span id="sMsg" style="color:var(--dim);font-size:12px"></span></div>
  </div>
  <div class="card"><h4>Identity</h4>
    <div class="field" style="margin-top:10px"><label>Your name</label><input id="oName" value="${esc(settings.owner_name||'')}"></div>
    <div class="field"><label>Business</label><input id="oBiz" value="${esc(settings.business||'')}"></div>
    <div class="field"><label>System prompt</label><input id="oPrompt" value="${esc(settings.system_prompt||'')}"></div>
    <button class="btn ghost" id="oSave">Save identity</button></div>
  <div class="card"><h4>Connected apps</h4><p>OAuth connectors (Google, Meta, TikTok, Slack, GitHub) are configured from the API tab in the README. Keys never touch the browser.</p></div>
  </div>`;

  v.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    v.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    const p = b.dataset.p;
    $('#sBase').value = (provs[p] && provs[p].base_url) || (settings.presets?.[p]?.base_url) || '';
    $('#sModel').value = (provs[p] && provs[p].model) || (settings.presets?.[p]?.model) || '';
    $('#sKey').value = '';
    $('#sKey').placeholder = provs[p]?.api_key ? 'leave blank to keep saved key' : 'paste key';
    $('#sBase').dataset.provider = p;
    $('#sBase').dataset.active = p;
  });
  $('#sBase').dataset.active = active;

  $('#sSave').onclick = async () => {
    const patch = {active_provider: $('#sBase').dataset.active,
                   base_url: $('#sBase').value.trim(), model: $('#sModel').value.trim()};
    if ($('#sKey').value.trim()) patch.api_key = $('#sKey').value.trim();
    await api('/api/settings', {method:'POST', body: JSON.stringify(patch)});
    $('#sMsg').textContent = 'saved';
    setTimeout(() => loadSettings(), 600);
    refreshModelPill();
  };
  $('#oSave').onclick = async () => {
    await api('/api/settings', {method:'POST', body: JSON.stringify({
      owner_name: $('#oName').value.trim(), business: $('#oBiz').value.trim(), system_prompt: $('#oPrompt').value})});
    $('#oSave').textContent = 'saved';
    setTimeout(() => loadSettings(), 600);
  };
}

async function refreshModelPill() {
  try {
    const s = await api('/api/settings');
    $('#modelPill').innerHTML = `<span class="dot"></span> <b>${esc(s.active_provider)}</b> · ${esc(s.model || 'no model')}`;
  } catch (e) { $('#modelPill').innerHTML = 'offline'; }
}

function openModal(src) {
  $('#modalImg').src = src;
  $('#modal').classList.add('on');
}
$('#modal').onclick = () => $('#modal').classList.remove('on');

/* ---------------- boot ---------------- */
show('chat');
refreshModelPill();
setInterval(() => { if (state.tab === 'chat') refreshModelPill(); }, 30000);

/* tap-through links inside messages and activity text */
function linkify(root) {
  const load = root || document.body;
  load.querySelectorAll('.bubble:not([data-ln]), .step:not([data-ln])').forEach(el => {
    el.dataset.ln = '1';
    const html = el.innerHTML.replace(/(\/api\/(?:media|screens)\/[\w.\-%]+|https?:\/\/[^\s"'<]+)/g,
      m => `<a href="${m}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline">${m}</a>`);
    if (html !== el.innerHTML) el.innerHTML = html;
  });
}
new MutationObserver(() => linkify()).observe(document.body, {childList: true, subtree: true});
linkify();
</script>
